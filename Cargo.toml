[package]
name = "arm64-hdmi-overlay"
version = "1.0.0"
edition = "2024"

[dependencies]
gtk = "0.15"
gdk = "0.15"
glib = "0.15"
webkit2gtk = { version = "0.18", features = ["v2_24"] }
ureq = { version = "2.9", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
